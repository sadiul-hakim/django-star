[project]
name = "django-star"
version = "0.1.0"
description = "Modern automation commands and file scaffolding for Django."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sadiul Hakim" }
]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "django>=4.2",
    "rich>=13.0.0",
]

[project.optional-dependencies]
drf = ["djangorestframework>=3.14.0"]
ninja = ["django-ninja>=1.0.0"]
all = [
    "djangorestframework>=3.14.0",
    "django-ninja>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/sadiul-hakim/django-star"
Issues = "https://github.com/sadiul-hakim/django-star/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/django_star"]